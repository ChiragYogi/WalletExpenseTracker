plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id  'com.google.devtools.ksp'
    id 'kotlin-parcelize'
    id  'androidx.navigation.safeargs.kotlin'
    id  'dagger.hilt.android.plugin'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace "com.babacode.walletexpensetracker"
    compileSdk rootProject.compileSdkVersion

    defaultConfig {

        applicationId "com.babacode.walletexpensetracker"
        minSdk rootProject.minSdkVersion
        targetSdk  rootProject.targetSdkVersion
        versionCode 6
        versionName "1.6"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
         }
    }

    buildFeatures{
        viewBinding true
        compose true
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    namespace 'com.babacode.walletexpensetracker'
}

dependencies {

    implementation 'com.google.firebase:firebase-crashlytics-ktx:19.4.4'
    implementation 'com.google.firebase:firebase-analytics-ktx:22.5.0'


    //core
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
    implementation "androidx.core:core-ktx:1.16.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"

    // Navigation Components
    implementation "androidx.navigation:navigation-fragment-ktx:2.9.3"
    implementation "androidx.navigation:navigation-ui-ktx:2.9.3"




    //Dagger - Hilt
    implementation "com.google.dagger:hilt-android:2.57.1"
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    ksp "com.google.dagger:hilt-android-compiler:2.57.1"

    // Room
    implementation "androidx.room:room-runtime:2.6.1"
    ksp "androidx.room:room-compiler:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"

    // Lifecycle + ViewModel & LiveData
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.3"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.9.3"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.9.3"
    implementation "androidx.lifecycle:lifecycle-viewmodel-savedstate:2.9.3"
    implementation "androidx.lifecycle:lifecycle-common-java8:2.9.3"

    //MpChart
    implementation "com.github.Philjay:mpandroidchart:3.1.0"

    // setting
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation "androidx.datastore:datastore-preferences:1.2.1"

    // Compose
    implementation platform("androidx.compose:compose-bom:2026.04.01")
    androidTestImplementation platform("androidx.compose:compose-bom:2026.04.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.9.3"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-test-manifest"

    //ktx
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation "androidx.fragment:fragment-ktx:1.8.9"

    //unit test
    testImplementation "junit:junit:$testJunit"

    //android test
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"
}

